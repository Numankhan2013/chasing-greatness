<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chasing Greatness</title>
  <meta name="description" content="Log lifts, earn ranks against 10.9M real lifts, see your progress. Free, private, offline.">
  <meta name="theme-color" content="#07080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Greatness">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="topbar">
    <a href="#/home" class="brand" aria-label="Chasing Greatness home"><img src="icons/icon.svg" alt="" width="30" height="30"><span>Chasing <b>Greatness</b></span></a>
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <div id="mobile-actions" class="mobile-actions"></div>
  </header>

  <main id="view" class="view"></main>

  <div id="rest" class="rest" hidden>
    <span class="rest-bar"><span id="rest-bar"></span></span>
    <span class="rest-label">Rest</span><b id="rest-time" class="mono">2:00</b>
    <button data-act="rest-add" class="rest-btn">+30s</button>
    <button data-act="rest-stop" class="rest-btn" aria-label="Stop timer">✕</button>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#fff">This tracker needs JavaScript enabled.</p></noscript>

  <!-- Libraries (pinned): GSAP (motion), canvas-confetti, ApexCharts (charts). Icons from Lucide are bundled in js/icons.js. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/standards.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/ui-core.js"></script>
  <script defer src="js/views-main.js"></script>
  <script defer src="js/views-ranks.js"></script>
  <script defer src="js/views-log.js"></script>
  <script defer src="js/views-data.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
